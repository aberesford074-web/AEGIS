      operationId: postAegisIndustryRadarAction
      summary: Read or update AEGIS Industry Radar
      description: Use this when the user asks about Industry Radar, sector news, saved industry signals, or LinkedIn drafts created from radar items. Industry Radar is not the prospect/company database.
      security:
        - AegisProxyBearer: []
