components:
  schemas:
    AegisProxyResponse:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        proxied:
          type: boolean
        upstreamStatus:
          type: number
        requestedAction:
          type: string
        action:
          type: string
        view:
          type: string
        note:
          type: string
        error:
          type: string
        updatedAt:
          type: string
        itemsCount:
          type: number
        sourcesCount:
          type: number
        radarItemsCount:
          type: number
        rowsCount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/AegisLooseItem"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AegisLooseItem"
        radarItems:
          type: array
          items:
            $ref: "#/components/schemas/AegisLooseItem"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AegisLooseItem"
        stats:
          $ref: "#/components/schemas/AegisStats"
        result:
          $ref: "#/components/schemas/AegisLooseItem"
    AegisLooseItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        status:
          type: string
        url:
          type: string
        summary:
          type: string
        source:
          type: string
    AegisStats:
      type: object
      additionalProperties: true
      properties:
        total:
          type: number
        sources:
          type: number
        scheduled:
          type: number
        drafted:
          type: number
        posted:
          type: number
        newItems:
          type: number
  securitySchemes:
    AegisProxyBearer:
      type: http
      scheme: bearer
